<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daxton's Life">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<title>Daxton's Life</title>
<style>
  :root { --ink:#f4f1ea; --dim:rgba(244,241,234,.62); --bg:#0b0b0b; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); }
  body { font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .hero { position:fixed; inset:0; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block;
              animation:settle 2.4s cubic-bezier(.2,.7,.2,1) both; }
  .hero::after { content:""; position:absolute; inset:0;
                 background:linear-gradient(180deg, rgba(11,11,11,.35) 0%, rgba(11,11,11,0) 22%, rgba(11,11,11,0) 45%, rgba(11,11,11,.82) 72%, #0b0b0b 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(14px + env(safe-area-inset-top)) 20px 0;
         display:flex; justify-content:space-between; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); z-index:2; }
  main { position:fixed; left:0; right:0; bottom:0; z-index:2;
         padding:0 24px calc(36px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  .hello { font-size:clamp(17px,4.6vw,22px); font-weight:500; color:var(--dim); margin-bottom:6px;
           animation:rise .9s .5s cubic-bezier(.2,.7,.2,1) both; }
  h1 { font-size:clamp(34px,10vw,84px); line-height:.92; font-weight:800; letter-spacing:-.035em;
       animation:rise 1s .75s cubic-bezier(.2,.7,.2,1) both; }
  h1 span { display:block; }
  .line { height:2px; width:56px; background:var(--ink); margin-top:22px; transform-origin:left;
          animation:grow .8s 1.4s cubic-bezier(.2,.7,.2,1) both; }
  .motto { margin-top:16px; font-size:clamp(16px,4.4vw,21px); font-weight:500; font-style:italic; color:var(--dim);
           animation:rise .9s 1.7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle { from { transform:scale(1.08); filter:brightness(.6); } to { transform:scale(1); filter:brightness(1); } }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <div class="hero"><img src="img/daxton.jpg" alt="Daxton leaning on an ATV, covered in mud"></div>
  <div class="top"><span>Daxton's Life</span><span id="day"></span></div>
<style>
    .rel { position:fixed; z-index:3; left:0; right:0; top:calc(44px + env(safe-area-inset-top));
           padding:0 16px; max-width:640px; margin:0 auto; animation:rise .9s .3s cubic-bezier(.2,.7,.2,1) both; }
    .pill { display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:14px; font-weight:600;
            color:var(--ink); background:rgba(20,20,20,.55); border:1px solid rgba(244,241,234,.22);
            border-radius:999px; padding:9px 16px; cursor:pointer; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
    .pill:active { transform:scale(.98); }
    .pill .n { font-size:12px; color:var(--dim); font-weight:500; }
    .chev { width:10px; height:10px; transition:transform .2s; }
    [aria-expanded="true"] > .chev { transform:rotate(180deg); }
    .panel { margin-top:10px; background:rgba(16,16,16,.78); border:1px solid rgba(244,241,234,.14); border-radius:20px;
             padding:12px; max-height:calc(100dvh - 200px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y:auto;
             -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); overscroll-behavior:contain; }
    .row { display:flex; gap:8px; }
    .row input { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:rgba(244,241,234,.08);
                 border:1px solid rgba(244,241,234,.16); border-radius:999px; padding:9px 14px; outline:none; }
    .row input:focus { border-color:rgba(244,241,234,.5); }
    .row input::placeholder { color:rgba(244,241,234,.45); }
    .add { font:inherit; font-size:14px; font-weight:600; border:0; border-radius:999px; padding:0 16px;
           background:var(--ink); color:#0b0b0b; cursor:pointer; }
    .add:disabled { opacity:.35; }
    .people { list-style:none; padding:0; margin-top:10px; display:flex; flex-direction:column; gap:8px; }
    .person > .pill { width:100%; justify-content:space-between; background:rgba(244,241,234,.06); }
    .person > .pill .nm { flex:1; text-align:left; }
    .notes { margin:8px 0 4px 14px; padding-left:12px; border-left:1px solid rgba(244,241,234,.16); }
    .notes ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
    .note { display:flex; align-items:flex-start; gap:8px; background:rgba(244,241,234,.1); border-radius:16px;
            padding:8px 8px 8px 14px; font-size:14px; line-height:1.35; }
    .note span { flex:1; overflow-wrap:anywhere; }
    .x { flex:none; border:0; background:none; color:var(--dim); font-size:18px; line-height:1; cursor:pointer; padding:0 4px; }
    .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:6px 4px 0; }
    .meta .over { color:#ff8a7a; }
    .rm { border:0; background:none; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; padding:0; text-decoration:underline; }
    .empty { font-size:13px; color:var(--dim); padding:10px 4px 2px; }
    .rel { max-height:calc(100dvh - 44px - env(safe-area-inset-top)); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:220px; }
    .pills { display:flex; flex-wrap:wrap; gap:8px; }
    a.pill { text-decoration:none; }
    .links-sec { margin-top:14px; padding-top:12px; border-top:1px solid rgba(244,241,234,.22); }
    .sec-label { font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:0 0 8px 2px; }
    .pill-plus { padding:9px 15px; font-size:17px; line-height:1; }
    .pill-tools { display:flex; justify-content:flex-end; margin:4px 2px 8px; }
    .pill-edit { min-height:44px; font-size:15px; padding:8px 2px; }
    .pill-wrap { display:inline-flex; align-items:stretch; max-width:100%; }
    .pill-wrap > .pill { border-top-right-radius:14px; border-bottom-right-radius:14px; text-decoration:none; }
    .pill-gear { flex:none; min-width:44px; min-height:44px; margin-left:-1px; padding:0 12px; border-radius:0 999px 999px 0;
      border:1px solid rgba(244,241,234,.22); background:rgba(20,20,20,.55); color:var(--ink); font:inherit; font-size:13px; font-weight:700; }
    .field { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
    .field input, .link-url { width:100%; font:inherit; font-size:16px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--ink);
      background:rgba(244,241,234,.08); border:1px solid rgba(244,241,234,.16); border-radius:14px; padding:12px 14px; min-height:44px; }
    .link-url { margin-top:8px; border-radius:999px; }
    .kind-pick { display:flex; gap:8px; margin-top:10px; }
    .kind-pick button { flex:1; min-height:44px; font:inherit; font-size:13px; font-weight:600; color:var(--ink); text-align:left;
      border:1px solid rgba(244,241,234,.22); border-radius:14px; padding:9px 10px; background:rgba(244,241,234,.05); }
    .kind-pick button small { display:block; font-weight:400; font-size:11px; color:var(--dim); margin-top:2px; }
    .kind-pick button[aria-pressed="true"] { border-color:var(--ink); background:rgba(244,241,234,.16); }
    .plus-tip { font-size:12px; color:var(--dim); margin:10px 2px 0; line-height:1.4; }
    .sheet { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet-card { width:100%; max-width:520px; background:#161616; border:1px solid rgba(244,241,234,.16); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .sheet-card h2 { font-size:18px; font-weight:700; }
    .sheet-card p { font-size:14px; line-height:1.45; color:var(--dim); }
    .sheet-card b { color:var(--ink); font-weight:600; }
    .sheet-actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .sheet-actions .add { min-height:44px; padding:0 18px; }
    .rm.danger { color:#ff8a7a; }
    [hidden] { display:none !important; }
  </style>
  <section class="rel">
    <div class="pills" id="pills"></div>
    <div class="links-sec">
      <div class="sec-label">Links</div>
      <div class="pills">
        <a class="pill" href="video.html">Video Converter <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></a>
        <button class="pill" id="igLink" type="button">Instagram <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div id="panels"></div>
  </section>
  <div class="sheet" id="pillSheet" hidden>
    <form class="sheet-card" id="pillForm">
      <h2 id="pillSheetTitle">Edit pill</h2>
      <label class="field">Name
        <input id="pillName" maxlength="40" autocomplete="off" enterkeyhint="done">
      </label>
      <label class="field" id="pillLinkWrap" hidden>Link
        <input id="pillHref" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://">
      </label>
      <p class="plus-tip" id="pillMsg"></p>
      <div class="sheet-actions">
        <button class="add" type="submit" id="pillSave">Save</button>
        <button class="rm" type="button" id="pillCancel">Cancel</button>
        <button class="rm danger pill-edit" type="button" id="pillDelete">Delete</button>
      </div>
    </form>
  </div>
  <script>
  (() => {
    // Beta keeps notes on this phone. Relationships stays in dl-relationships so older notes are kept.
    // New pills and renamed titles live in dl-pills. There is no sync code on this branch.
    const REL = "dl-relationships", EXTRA = "dl-pills", CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const words = s => s.trim().split(/\s+/).filter(Boolean).length;
    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const now = () => Date.now();
    let people = [], open = new Set(), drafts = {}, focusId = null, armedRemove = null;
    try { people = JSON.parse(localStorage.getItem(REL) || "[]"); } catch (e) {}
    let extra = { title:"", hidden:false, orgTitle:"", orgHidden:false, custom:[] };
    try { const d = JSON.parse(localStorage.getItem(EXTRA) || "null"); if (d && Array.isArray(d.custom)) extra = { title:d.title||"", hidden:!!d.hidden, orgTitle:d.orgTitle||"", orgHidden:!!d.orgHidden, custom:d.custom }; } catch (e) {}
    const savePeople = () => { try { localStorage.setItem(REL, JSON.stringify(people)); } catch (e) {} };
    const saveExtra = () => { try { localStorage.setItem(EXTRA, JSON.stringify(extra)); } catch (e) {} };
    const tidyUrl = v => { v = (v || "").trim(); if (!v) return ""; if (/^(https?:|mailto:)/i.test(v)) return v; return "https://" + v; };

    let pillEdit = null, pillDelArmed = false;
    function openPillEdit(spec) {
      pillEdit = spec; pillDelArmed = false;
      $("pillSheetTitle").textContent = "Edit pill";
      $("pillName").value = spec.name || "";
      $("pillHref").value = spec.href || "";
      $("pillLinkWrap").hidden = !spec.hasLink;
      $("pillDelete").textContent = "Delete";
      $("pillMsg").textContent = spec.kind === "rel" ? "Deleting hides Relationships and keeps the people in it. Bring it back from +." : (spec.kind === "org" ? "Deleting hides this pill. Bring it back from +." : "");
      $("pillSheet").hidden = false;
      setTimeout(() => $("pillName").focus(), 60);
    }
    function closePillEdit() { $("pillSheet").hidden = true; pillEdit = null; }
    $("pillForm").onsubmit = e => {
      e.preventDefault();
      const spec = pillEdit; if (!spec) return;
      const name = $("pillName").value.trim().replace(/\s+/g, " ").slice(0, 40);
      if (!name) { $("pillMsg").textContent = "Give the pill a name."; return; }
      if (spec.kind === "rel") { extra.title = name; extra.hidden = false; saveExtra(); }
      else if (spec.kind === "org") { extra.orgTitle = name; extra.orgHidden = false; saveExtra(); }
      else if (spec.kind === "person") {
        const p = people.find(x => x.id === spec.id); if (p) { p.name = name; savePeople(); }
      } else if (spec.kind === "list" || spec.kind === "link") {
        const item = extra.custom.find(x => x.id === spec.id); if (!item) return;
        item.name = name; item.updated = now();
        if (spec.kind === "link") { const href = tidyUrl($("pillHref").value); if (!href) { $("pillMsg").textContent = "Add a link."; return; } item.href = href; }
        saveExtra();
      }
      closePillEdit(); render();
    };
    $("pillCancel").onclick = () => closePillEdit();
    $("pillDelete").onclick = () => {
      const spec = pillEdit; if (!spec) return;
      if (!pillDelArmed) { pillDelArmed = true; $("pillDelete").textContent = "Tap again to delete"; return; }
      if (spec.kind === "rel") { extra.hidden = true; saveExtra(); }
      else if (spec.kind === "org") { extra.orgHidden = true; saveExtra(); }
      else if (spec.kind === "person") { open.delete(spec.id); people = people.filter(x => x.id !== spec.id); savePeople(); }
      else { const item = extra.custom.find(x => x.id === spec.id); if (item) { item.deleted = true; item.updated = now(); saveExtra(); } }
      closePillEdit(); render();
    };
    $("pillSheet").onclick = e => { if (e.target.id === "pillSheet") closePillEdit(); };

    // Organize SD card runs on the MacBook. Never navigate to localhost unless it just answered.
    const ORGANIZER = "http://127.0.0.1:8765/";
    const orgName = () => (!extra.orgTitle || extra.orgTitle === "Organize SD card") ? "SD Organizer" : extra.orgTitle;
    const orgSheet = el("div", "sheet"); orgSheet.hidden = true; orgSheet.id = "orgSheet";
    const orgCard = el("div", "sheet-card"); orgCard.setAttribute("role", "dialog"); orgCard.setAttribute("aria-labelledby", "orgTitle");
    const orgTitle = el("h2", null, "This runs on your MacBook"); orgTitle.id = "orgTitle";
    const orgWhy = el("p"), orgHow = el("p"), orgWhere = el("p");
    orgHow.innerHTML = "<b>How to start it on the MacBook</b><br>1. Plug the SD card and the hard drive into the MacBook.<br>2. In Finder, open <b>Applications</b>, then the folder <b>sd-card-organizer</b>.<br>3. Double-click <b>Organize SD Card.command</b>.<br>The file is <b>~/Applications/sd-card-organizer/Organize SD Card.command</b>.<br>4. If the Mac says it can't be opened, Control-click it and choose Open.<br>Leave that window open while it copies. Then tap SD Organizer again.";
    orgWhere.innerHTML = "<b>Where the files go</b><br>Hard drive / Sony / YYYY-MM-DD / Photos / Vertical<br>Hard drive / Sony / YYYY-MM-DD / Photos / Horizontal<br>Hard drive / Sony / YYYY-MM-DD / Videos / Vertical<br>Hard drive / Sony / YYYY-MM-DD / Videos / Horizontal<br>A taller photo or video goes in Vertical. A square goes in Horizontal. This copy only works on the Mac, not the iPhone.";
    const orgActions = el("div", "sheet-actions");
    const orgOpen = el("button", "add", "Open the organizer");
    orgOpen.type = "button";
    orgOpen.hidden = true;
    orgOpen.onclick = () => { const popup = window.open(ORGANIZER, "_blank", "noopener"); if (popup) orgSheet.hidden = true; };
    const orgClose = el("button", "rm", "Close"); orgClose.type = "button";
    orgClose.onclick = () => { orgSheet.hidden = true; };
    orgActions.append(orgOpen, orgClose);
    orgCard.append(orgTitle, orgWhy, orgHow, orgWhere, orgActions);
    orgSheet.append(orgCard);
    orgSheet.addEventListener("click", e => { if (e.target === orgSheet) orgSheet.hidden = true; });
    document.body.append(orgSheet);
    const orgIos = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      || (navigator.userAgentData && navigator.userAgentData.mobile);
    function showOrganizer(kind, running) {
      orgOpen.hidden = !running;
      orgWhy.textContent = kind === "iphone"
        ? "You're on the iPhone. This only works on the MacBook. The iPhone can't see an SD card or hard drive plugged into the Mac, so this stays here instead of opening an error page."
        : (running
          ? "The organizer is running on this Mac."
          : "The organizer isn't running, so this stayed on Daxton's Life instead of opening an error page. Start it on the MacBook with the steps below, then tap SD Organizer again. It does not work on the iPhone.");
      closePillEdit();
      orgSheet.hidden = false;
    }
    function organizerUrl(value) {
      try {
        const url = new URL(value, location.href);
        return (url.hostname === "127.0.0.1" || url.hostname === "localhost") && url.port === "8765";
      } catch (e) { return false; }
    }
    document.addEventListener("click", ev => {
      const link = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
      if (!link || !organizerUrl(link.href)) return;
      ev.preventDefault();
      openOrganizer();
    }, true);
    function openOrganizer() {
      if (orgIos) { showOrganizer("iphone", false); return; }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1500);
      fetch(ORGANIZER + "api/health", { signal: ctrl.signal, cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(j => {
          if (!j || !j.ok) throw 0;
          const popup = window.open(ORGANIZER, "_blank", "noopener");
          if (!popup) showOrganizer("mac", true);
        })
        .catch(() => showOrganizer("mac", false))
        .finally(() => clearTimeout(timer));
    }

    // Instagram runs on the MacBook. Never open localhost unless it just answered.
    const IG = "http://127.0.0.1:8766/";
    const igSheet = el("div", "sheet"); igSheet.hidden = true; igSheet.id = "igSheet";
    const igCard = el("div", "sheet-card"); igCard.setAttribute("role", "dialog"); igCard.setAttribute("aria-labelledby", "igTitle");
    const igTitle = el("h2", null, "This runs on your MacBook"); igTitle.id = "igTitle";
    const igWhy = el("p"), igHow = el("p"), igWhere = el("p");
    igHow.innerHTML = "<b>How to start it on the MacBook</b><br>1. In Finder, open <b>Applications</b>, then the folder <b>instagram-downloader</b>.<br>2. The first time, double-click <b>Install Instagram Downloader.command</b>.<br>3. Double-click <b>Download Instagram.command</b>.<br>The file is <b>~/Applications/instagram-downloader/Download Instagram.command</b>.<br>4. If the Mac says it can't be opened, Control-click it and choose Open.<br>Leave that window open. Then tap Instagram again.";
    igWhere.innerHTML = "<b>Where the files go</b><br>Downloads / Instagram / YYYY-MM-DD_HHMMSS_shortcode<br>A zip of that folder is saved next to it. Public Reels and posts only. No Instagram login. This does not work on the iPhone.";
    const igActions = el("div", "sheet-actions");
    const igOpen = el("button", "add", "Open the downloader"); igOpen.type = "button"; igOpen.hidden = true; igOpen.style.padding = "12px 18px";
    igOpen.onclick = () => { const popup = window.open(IG, "_blank", "noopener"); if (popup) igSheet.hidden = true; };
    const igClose = el("button", "rm", "Close"); igClose.type = "button";
    igClose.onclick = () => { igSheet.hidden = true; };
    igActions.append(igOpen, igClose);
    igCard.append(igTitle, igWhy, igHow, igWhere, igActions);
    igSheet.append(igCard);
    igSheet.addEventListener("click", e => { if (e.target === igSheet) igSheet.hidden = true; });
    document.body.append(igSheet);
    function showInstagram(kind, running) {
      igOpen.hidden = !running;
      igWhy.textContent = kind === "iphone"
        ? "You're on the iPhone. This only works on the MacBook. The phone can't save the video onto the Mac, so this stays here instead of opening an error page."
        : (running
          ? "The downloader is running on this Mac."
          : "The downloader isn't running, so this stayed on Daxton's Life instead of opening an error page. Start it on the MacBook with the steps below, then tap Instagram again. It does not work on the iPhone.");
      closePillEdit();
      igSheet.hidden = false;
    }
    function instagramUrl(value) {
      try {
        const url = new URL(value, location.href);
        return (url.hostname === "127.0.0.1" || url.hostname === "localhost") && url.port === "8766";
      } catch (e) { return false; }
    }
    document.addEventListener("click", ev => {
      const link = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
      if (!link || !instagramUrl(link.href)) return;
      ev.preventDefault();
      openInstagram();
    }, true);
    function openInstagram() {
      if (orgIos) { showInstagram("iphone", false); return; }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1500);
      fetch(IG + "api/health", { signal: ctrl.signal, cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(j => {
          if (!j || !j.ok || j.name !== "instagram-downloader") throw 0;
          const popup = window.open(IG, "_blank", "noopener");
          if (!popup) showInstagram("mac", true);
        })
        .catch(() => showInstagram("mac", false))
        .finally(() => clearTimeout(timer));
    }
    $("igLink").onclick = () => openInstagram();

    const pills = $("pills"), panels = $("panels");
    function listPanel(title, count, items, key) {
      const btn = el("button", "pill"); btn.type = "button"; btn.setAttribute("aria-expanded", "false");
      btn.append(document.createTextNode(title + " "), el("span", "n", count ? String(count) : "")); btn.insertAdjacentHTML("beforeend", CHEV);
      const panel = el("div", "panel"); panel.hidden = true;
      const tools = el("div", "pill-tools"), edit = el("button", "rm pill-edit", "Edit pill"); edit.type = "button";
      edit.onclick = () => openPillEdit(key === "rel" ? { kind:"rel", name:title } : { kind:"list", id:key, name:title });
      tools.append(edit);
      const form = el("form", "row"), input = el("input"), add = el("button", "add", "Add");
      input.placeholder = key === "rel" ? "Add a person" : "Add an item"; input.maxLength = 60; input.autocomplete = "off"; add.type = "submit";
      form.append(input, add);
      const list = el("ul", "people");
      panel.append(tools, form, list);
      btn.onclick = () => { const opening = panel.hidden; panels.querySelectorAll(".panel").forEach(p => { p.hidden = true; }); pills.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-expanded", "false")); if (opening) { panel.hidden = false; btn.setAttribute("aria-expanded", "true"); } };
      form.onsubmit = e => {
        e.preventDefault();
        const v = input.value.trim().replace(/\s+/g, " "); if (!v) return;
        input.value = "";
        const rec = { id:(key === "rel" ? "p" : "i") + now(), name:v, created:now(), notes:[] };
        if (key === "rel") { people.push(rec); open.add(rec.id); focusId = rec.id; savePeople(); }
        else { const bag = itemsStore(key); bag.push(rec); open.add(rec.id); focusId = rec.id; saveExtra(); }
        render();
      };
      items.forEach(p => {
        const li = el("li", "person"), isOpen = open.has(p.id);
        const b = el("button", "pill"); b.type = "button"; b.setAttribute("aria-expanded", isOpen);
        b.append(el("span", "nm", p.name), el("span", "n", (p.notes || []).length || "")); b.insertAdjacentHTML("beforeend", CHEV);
        b.onclick = () => { isOpen ? open.delete(p.id) : open.add(p.id); render(); };
        li.append(b);
        if (isOpen) {
          const box = el("div", "notes"), ul = el("ul");
          const rename = el("form", "row"), rn = el("input"), rs = el("button", "add", "Save");
          rn.value = p.name; rn.maxLength = 60; rn.setAttribute("aria-label", "Pill name"); rs.type = "submit";
          rename.onsubmit = e => { e.preventDefault(); const v = rn.value.trim(); if (!v) return; p.name = v; if (key === "rel") savePeople(); else saveExtra(); render(); };
          rename.append(rn, rs); box.append(rename);
          (p.notes || []).forEach((t, i) => {
            const n = el("li", "note"); n.append(el("span", null, t));
            const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "Delete note");
            x.onclick = () => { p.notes = p.notes.filter((_, j) => j !== i); if (key === "rel") savePeople(); else saveExtra(); render(); };
            n.append(x); ul.append(n);
          });
          const f = el("form", "row"), inp = el("input"), addN = el("button", "add", "Add");
          inp.placeholder = "A story, desire, or thing to remember"; inp.autocomplete = "off"; inp.value = drafts[p.id] || ""; addN.type = "submit";
          const meta = el("div", "meta"), cnt = el("span"), rm = el("button", "rm danger", armedRemove === p.id ? "Tap again to remove" : "Remove");
          rm.type = "button";
          rm.onclick = () => { if (armedRemove !== p.id) { armedRemove = p.id; render(); return; } armedRemove = null; open.delete(p.id); if (key === "rel") { people = people.filter(x => x.id !== p.id); savePeople(); } else { const bag = itemsStore(key); const i = bag.findIndex(x => x.id === p.id); if (i >= 0) bag.splice(i, 1); saveExtra(); } render(); };
          const upd = () => { const w = words(inp.value); cnt.textContent = w + (w === 1 ? " word" : " words"); addN.disabled = !w; };
          inp.oninput = () => { drafts[p.id] = inp.value; upd(); }; upd();
          f.onsubmit = e => {
            e.preventDefault();
            const v = inp.value.trim().replace(/\s+/g, " "); if (!v) return;
            drafts[p.id] = ""; focusId = p.id; p.notes = [...(p.notes || []), v];
            if (key === "rel") savePeople(); else saveExtra(); render();
          };
          f.append(inp, addN); meta.append(cnt, rm); box.append(ul, f, meta); li.append(box);
          if (focusId === p.id) { focusId = null; setTimeout(() => inp.focus(), 0); }
        }
        list.append(li);
      });
      if (!items.length) list.append(el("li", "empty", "Nothing yet. Add the first one above."));
      return [btn, panel];
    }
    const itemsStore = id => { const item = extra.custom.find(x => x.id === id); item.items = item.items || []; return item.items; };

    function render() {
      const openPanel = panels.querySelector(".panel:not([hidden])");
      const openKey = openPanel && openPanel.dataset.key;
      pills.replaceChildren(); panels.replaceChildren();
      if (!extra.hidden) {
        const [btn, panel] = listPanel(extra.title || "Relationships", people.length, people.slice().sort((a,b)=>(a.created||0)-(b.created||0)), "rel");
        panel.dataset.key = "rel"; pills.append(btn); panels.append(panel);
        if (openKey === "rel") { panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
      }
      extra.custom.filter(c => !c.deleted && c.kind !== "link").sort((a,b)=>(a.created||0)-(b.created||0)).forEach(c => {
        const items = (c.items || []).slice().sort((a,b)=>(a.created||0)-(b.created||0));
        const [btn, panel] = listPanel(c.name, items.length, items, c.id);
        panel.dataset.key = c.id; pills.append(btn); panels.append(panel);
        if (openKey === c.id) { panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
      });
      extra.custom.filter(c => !c.deleted && c.kind === "link").forEach(c => {
        const wrap = el("span", "pill-wrap"), a = el("a", "pill", c.name); a.href = c.href || "#";
        const gear = el("button", "pill-gear", "Edit"); gear.type = "button"; gear.setAttribute("aria-label", "Edit " + c.name);
        gear.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); openPillEdit({ kind:"link", id:c.id, name:c.name, href:c.href, hasLink:true }); };
        wrap.append(a, gear); pills.append(wrap);
      });
      if (!extra.orgHidden) {
        const wrap = el("span", "pill-wrap sd-organizer"), btn = el("button", "pill"); btn.type = "button";
        btn.append(document.createTextNode(orgName() + " "));
        btn.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>');
        btn.onclick = () => openOrganizer();
        const gear = el("button", "pill-gear", "Edit"); gear.type = "button"; gear.setAttribute("aria-label", "Edit " + orgName());
        gear.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); orgSheet.hidden = true; openPillEdit({ kind:"org", name:orgName() }); };
        wrap.append(btn, gear);
        pills.insertBefore(wrap, pills.firstChild);
      }
      const plus = el("button", "pill pill-plus", "+"); plus.type = "button"; plus.setAttribute("aria-label", "Add a pill");
      const plusPanel = el("div", "panel"); plusPanel.hidden = true; plusPanel.dataset.key = "plus";
      const f = el("form", "row"), inp = el("input"), go = el("button", "add", "Add");
      inp.placeholder = "Name your new pill"; inp.maxLength = 40; inp.autocomplete = "off"; go.type = "submit"; f.append(inp, go);
      const linkIn = el("input"); linkIn.className = "link-url"; linkIn.hidden = true; linkIn.placeholder = "Link (https://…)"; linkIn.inputMode = "url"; linkIn.autocomplete = "off";
      let kind = "notes";
      const pick = el("div", "kind-pick");
      const opt = (k, t, sub) => { const b = el("button"); b.type = "button"; b.append(document.createTextNode(t), el("small", null, sub)); b.setAttribute("aria-pressed", k === kind);
        b.onclick = () => { kind = k; linkIn.hidden = k !== "link"; pick.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); go.disabled = !inp.value.trim() || (kind === "link" && !linkIn.value.trim()); }; return b; };
      pick.append(opt("notes", "List with notes", "Like Relationships"), opt("link", "Link", "Opens a page"));
      const hidden = [];
      if (extra.hidden) hidden.push("Relationships");
      if (extra.orgHidden) hidden.push(orgName());
      extra.custom.filter(c => c.deleted).forEach(c => hidden.push(c.name));
      plusPanel.append(f, linkIn, pick, el("p", "plus-tip", "Open a pill and tap Edit pill to rename it. A link pill’s Edit button changes the name and the link."));
      if (hidden.length) {
        const row = el("div");
        hidden.forEach(label => { const b = el("button", "rm pill-edit", "Bring back " + label); b.type = "button"; b.onclick = () => {
          if (label === "Relationships" && extra.hidden) { extra.hidden = false; saveExtra(); }
          else if (extra.orgHidden && label === orgName()) { extra.orgHidden = false; saveExtra(); }
          else { const c = extra.custom.find(x => x.deleted && x.name === label); if (c) { c.deleted = false; c.updated = now(); saveExtra(); } }
          render();
        }; row.append(b); });
        plusPanel.append(el("p", "plus-tip", "Hidden pills"), row);
      }
      const upd = () => { go.disabled = !inp.value.trim() || (kind === "link" && !linkIn.value.trim()); };
      inp.oninput = upd; linkIn.oninput = upd;
      linkIn.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); if (!go.disabled) f.requestSubmit(); } });
      go.disabled = true;
      f.onsubmit = e => {
        e.preventDefault();
        const v = inp.value.trim().replace(/\s+/g, " "); if (!v) return;
        if (kind === "link") { const href = tidyUrl(linkIn.value); if (!href) return; extra.custom.push({ id:"lp"+now(), name:v, kind:"link", href, created:now(), updated:now() }); }
        else extra.custom.push({ id:"cp"+now(), name:v, kind:"notes", items:[], created:now(), updated:now() });
        saveExtra(); render();
      };
      plus.onclick = () => { const opening = plusPanel.hidden; panels.querySelectorAll(".panel").forEach(p => p.hidden = true); pills.querySelectorAll("button.pill").forEach(b => b.setAttribute("aria-expanded","false")); if (opening) { plusPanel.hidden = false; plus.setAttribute("aria-expanded","true"); } };
      pills.append(plus); panels.append(plusPanel);
      if (openKey === "plus") { plusPanel.hidden = false; plus.setAttribute("aria-expanded", "true"); }
    }
    render();
  })();
  </script>
  <main>
    <p class="hello">Hello Daxton,</p>
    <h1><span>let's take over</span><span>the world.</span></h1>
    <div class="line"></div>
    <p class="motto">If it's not a hell yes, it's a no.</p>
  </main>
<script>
  document.getElementById("day").textContent =
    new Date().toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  if ("serviceWorker" in navigator) {
    let reloading = false;
    const hadController = !!navigator.serviceWorker.controller;
    const reloadOnce = () => { if (reloading) return; reloading = true; location.reload(); };
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) reloadOnce(); });
    navigator.serviceWorker.addEventListener("message", e => { if (e.data === "reload") reloadOnce(); });
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.update) reg.update();
      document.addEventListener("visibilitychange", () => { if (!document.hidden && reg.update) reg.update(); });
    }).catch(() => {});
  }
</script>
