<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daxton's Life">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="img/daxton.jpg" fetchpriority="high">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<title>Daxton's Life</title>
<style>
  :root { --ink:#f4f1ea; --dim:rgba(244,241,234,.62); --bg:#0b0b0b; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); }
  body { font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .hero { position:fixed; inset:0; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block;
              animation:settle 1s cubic-bezier(.2,.7,.2,1) both; }
  .hero::after { content:""; position:absolute; inset:0;
                 background:linear-gradient(180deg, rgba(11,11,11,.35) 0%, rgba(11,11,11,0) 22%, rgba(11,11,11,0) 45%, rgba(11,11,11,.82) 72%, #0b0b0b 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(14px + env(safe-area-inset-top)) 20px 0;
         display:flex; justify-content:space-between; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); z-index:2; }
  main { position:fixed; left:0; right:0; bottom:0; z-index:2;
         padding:0 24px calc(36px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  .hello { font-size:clamp(17px,4.6vw,22px); font-weight:500; color:var(--dim); margin-bottom:6px;
           animation:rise .6s .1s cubic-bezier(.2,.7,.2,1) both; }
  h1 { font-size:clamp(34px,10vw,84px); line-height:.92; font-weight:800; letter-spacing:-.035em;
       animation:rise .6s .2s cubic-bezier(.2,.7,.2,1) both; }
  h1 span { display:block; }
  .line { height:2px; width:56px; background:var(--ink); margin-top:22px; transform-origin:left;
          animation:grow .5s .45s cubic-bezier(.2,.7,.2,1) both; }
  .motto { margin-top:16px; font-size:clamp(16px,4.4vw,21px); font-weight:500; font-style:italic; color:var(--dim);
           animation:rise .6s .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle { from { transform:scale(1.08); filter:brightness(.6); } to { transform:scale(1); filter:brightness(1); } }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <div class="hero"><img src="img/daxton.jpg" fetchpriority="high" decoding="async" alt="Daxton leaning on an ATV, covered in mud"></div>
  <div class="top"><span>Daxton's Life</span><span id="day"></span></div>
<style>
    .rel { position:fixed; z-index:3; left:0; right:0; top:calc(44px + env(safe-area-inset-top));
           padding:0 16px; max-width:640px; margin:0 auto; animation:rise .5s 0s cubic-bezier(.2,.7,.2,1) both; }
    .pill { display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:14px; font-weight:600;
            color:var(--ink); background:rgba(20,20,20,.55); border:1px solid rgba(244,241,234,.22);
            border-radius:999px; padding:9px 16px; cursor:pointer; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
    .pills { display:flex; flex-wrap:wrap; gap:8px; }
    .pill:active { transform:scale(.98); }
    .pill .n { font-size:12px; color:var(--dim); font-weight:500; }
    .chev { width:10px; height:10px; transition:transform .2s; }
    [aria-expanded="true"] > .chev { transform:rotate(180deg); }
    .panel { margin-top:10px; background:rgba(16,16,16,.78); border:1px solid rgba(244,241,234,.14); border-radius:20px;
             padding:12px; max-height:calc(100dvh - 200px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y:auto;
             -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); overscroll-behavior:contain; }
    .row { display:flex; gap:8px; }
    .row input { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:rgba(244,241,234,.08);
                 border:1px solid rgba(244,241,234,.16); border-radius:999px; padding:9px 14px; outline:none; }
    .row input:focus { border-color:rgba(244,241,234,.5); }
    .row input::placeholder { color:rgba(244,241,234,.45); }
    .add { font:inherit; font-size:14px; font-weight:600; border:0; border-radius:999px; padding:0 16px;
           background:var(--ink); color:#0b0b0b; cursor:pointer; }
    .add:disabled { opacity:.35; }
    .people { list-style:none; padding:0; margin-top:10px; display:flex; flex-direction:column; gap:8px; }
    .person > .pill { width:100%; justify-content:space-between; background:rgba(244,241,234,.06); }
    .person > .pill .nm { flex:1; text-align:left; }
    .notes { margin:8px 0 4px 14px; padding-left:12px; border-left:1px solid rgba(244,241,234,.16); }
    .notes ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
    .note { display:flex; align-items:flex-start; gap:8px; background:rgba(244,241,234,.1); border-radius:16px;
            padding:8px 8px 8px 14px; font-size:14px; line-height:1.35; }
    .note span { flex:1; overflow-wrap:anywhere; }
    .x { flex:none; border:0; background:none; color:var(--dim); font-size:18px; line-height:1; cursor:pointer; padding:0 4px; }
    .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:6px 4px 0; }
    .meta .over { color:#ff8a7a; }
    .rm { border:0; background:none; color:var(--dim); font:inherit; font-size:12px; cursor:pointer; padding:0; text-decoration:underline; }
    [hidden] { display:none !important; }
    .people .pill, .note.holdable { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
    .people .pill.pressing, .note.pressing { transform:scale(.97); background:rgba(244,241,234,.16); transition:transform .45s, background .45s; }
    .editbox { display:flex; flex-direction:column; gap:6px; padding:8px; border:1px solid rgba(244,241,234,.3); border-radius:18px; background:rgba(244,241,234,.06); }
    .rm.danger { color:#ff8a7a; }
    .hint { font-size:12px; color:rgba(244,241,234,.45); }
    .note span { cursor:text; }
    .note.editing { padding:6px; background:rgba(244,241,234,.14); flex-direction:column; align-items:stretch; }
    .note.editing .row input { padding:7px 12px; font-size:16px; }
    .note.editing .meta { margin:4px 6px 0; }
    .ed { flex:none; border:0; background:none; color:var(--dim); font-size:13px; cursor:pointer; padding:2px 4px; }
    .links { display:flex; gap:14px; }
    .rename { display:flex; gap:8px; margin:8px 0 4px; }
    .update { position:fixed; z-index:11; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom));
              font:inherit; font-size:13px; font-weight:600; border:0; border-radius:999px; padding:10px 16px;
              background:var(--ink); color:#0b0b0b; box-shadow:0 6px 24px rgba(0,0,0,.4); cursor:pointer; }
    .empty { font-size:13px; color:var(--dim); padding:10px 4px 2px; }
    .top { align-items:center; gap:10px; }
    .top > span:first-child { flex:1; }
    .syncbtn { font:inherit; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--dim);
               background:rgba(20,20,20,.5); border:1px solid rgba(244,241,234,.2); border-radius:999px; padding:4px 10px; cursor:pointer; }
    .syncbtn::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:1px; background:#8a8a8a; }
    .syncbtn[data-state="ok"]::before { background:#7fd18b; }
    .syncbtn[data-state="syncing"]::before { background:#e8d27a; }
    .syncbtn[data-state="error"]::before, .syncbtn[data-state="auth"]::before { background:#ff8a7a; }
    .sheet { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center;
             padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet-card { width:100%; max-width:520px; background:#161616; border:1px solid rgba(244,241,234,.16); border-radius:22px; padding:18px;
                  display:flex; flex-direction:column; gap:12px; }
    .sheet-card h2 { font-size:18px; font-weight:700; }
    .sheet-card p { font-size:14px; line-height:1.45; color:var(--dim); }
    .sheet-card b { color:var(--ink); font-weight:600; }
    .sheet-msg:empty { display:none; }
    .sheet-actions { display:flex; flex-wrap:wrap; gap:16px; }
  </style>
  <section class="rel" id="rel">
    <div class="pills" id="pills"></div>
    <div id="panels"></div>
  </section>
  <div class="sheet" id="syncSheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="syncTitle">
      <h2 id="syncTitle">Sync your notes</h2>
      <p id="syncInfo">Notes save to your private GitHub repo <b>daxtons-life-data</b>, so every device shows the same thing.</p>
      <form class="row" id="syncForm">
        <input id="syncToken" type="password" placeholder="Paste your GitHub sync code" autocomplete="off" spellcheck="false">
        <button class="add" type="submit">Connect</button>
      </form>
      <p class="sheet-msg" id="syncMsg"></p>
      <div class="sheet-actions">
        <button class="rm" type="button" id="syncNow" hidden>Sync now</button>
        <button class="rm" type="button" id="syncOff" hidden>Turn off sync on this device</button>
        <button class="rm" type="button" id="syncClose">Close</button>
      </div>
    </div>
  </div>
  <script>
  (() => {
    // ---------- Sections: each pill works the same way ----------
    const SECTIONS = [
      { key:"rel",    title:"Relationships", oldLs:"dl-relationships", addPh:"Add a person",           notePh:"A story, desire, or thing to remember", rmLabel:"Remove person", empty:"No one yet. Add your first person above." },
      { key:"justdo", title:"Just dos",      oldLs:"dl-justdos",       addPh:"Add something to just do", notePh:"A detail, step, or reminder",         rmLabel:"Remove",        empty:"Nothing yet. Add your first one above." },
      { key:"work",   title:"Work",          oldLs:"dl-work",          addPh:"Add a work item",        notePh:"A task, idea, or thing to remember",    rmLabel:"Remove",        empty:"Nothing yet. Add your first work item above." },
      { key:"school", title:"School",        oldLs:"dl-school",        addPh:"Add a class or project", notePh:"An assignment, idea, or reminder",     rmLabel:"Remove",        empty:"Nothing yet. Add your first class or project above." }
    ];
    const MAX = 15, LS = "dl-data", SYNC = "dl-sync";
    const REPO = "daxtontessmer-ai/daxtons-life-data", FILE = "data.json";
    const CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const words = s => s.trim().split(/\s+/).filter(Boolean).length;
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const $ = id => document.getElementById(id);
    const now = () => Date.now();

    // ---------- Local store (one object for all sections) ----------
    const empty = () => ({ version:1, sections:Object.fromEntries(SECTIONS.map(c => [c.key, []])) });
    let data = empty();
    try { const d = JSON.parse(localStorage.getItem(LS)); if (d && d.sections) data = d; } catch (e) {}
    // Bring over notes saved by older versions of the app
    for (const c of SECTIONS) {
      data.sections[c.key] = data.sections[c.key] || [];
      try {
        const old = JSON.parse(localStorage.getItem(c.oldLs) || "null");
        if (Array.isArray(old) && old.length) {
          const have = new Set(data.sections[c.key].map(i => i.id));
          old.forEach(i => { if (!have.has(i.id)) data.sections[c.key].push({ ...i, updated: i.updated || i.created || now() }); });
          localStorage.setItem(c.oldLs + "-migrated", JSON.stringify(old)); localStorage.removeItem(c.oldLs);
        }
      } catch (e) {}
    }
    const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} };
    saveLocal();
    function changed() { saveLocal(); renderAll(); queuePush(); }

    // ---------- Merge: newest edit of each item wins; deletions are remembered ----------
    function merge(a, b) {
      const out = empty();
      for (const c of SECTIONS) {
        const m = new Map();
        for (const it of [...((a.sections||{})[c.key]||[]), ...((b.sections||{})[c.key]||[])]) {
          const cur = m.get(it.id);
          if (!cur || (it.updated||0) > (cur.updated||0)) m.set(it.id, it);
        }
        out.sections[c.key] = [...m.values()];
      }
      out.devices = { ...((b||{}).devices||{}) };
      for (const [k, v] of Object.entries((a||{}).devices||{})) if (!out.devices[k] || (v.last||0) > (out.devices[k].last||0)) out.devices[k] = v;
      return out;
    }

    // ---------- GitHub sync ----------
    let token = ""; try { token = (JSON.parse(localStorage.getItem(SYNC)||"{}").token) || ""; } catch (e) {}
    let deviceId = ""; try { deviceId = localStorage.getItem("dl-device") || ""; if (!deviceId) { deviceId = "d" + now().toString(36) + Math.random().toString(36).slice(2, 6); localStorage.setItem("dl-device", deviceId); } } catch (e) { deviceId = "d-temp"; }
    const deviceName = () => { const u = navigator.userAgent; return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Mac/.test(u) ? "Mac" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : "Device"; };
    let sha = null, pushTimer = null, busy = false, again = false, lastSync = null, status = "off";
    const b64e = s => { const u = new TextEncoder().encode(s); let bin = ""; u.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
    const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), ch => ch.charCodeAt(0)));
    const api = (method, body) => fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
      method, cache:"no-store",
      headers:{ Authorization:"Bearer " + token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" },
      body: body ? JSON.stringify(body) : undefined
    });
    async function pull() {
      const r = await api("GET");
      if (r.status === 404) { sha = null; return empty(); }
      if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth:true });
      if (!r.ok) throw new Error("pull " + r.status);
      const j = await r.json(); sha = j.sha; return JSON.parse(b64d(j.content));
    }
    async function sync() {
      if (!token) { setStatus("off"); return; }
      if (!navigator.onLine) { setStatus("offline"); return; }
      if (busy) { again = true; return; }
      busy = true; setStatus("syncing");
      try {
        for (let tries = 0; tries < 3; tries++) {
          const remote = await pull();
          const merged = merge(data, remote);
          const prev = (merged.devices||{})[deviceId];
          if (!prev || now() - (prev.last||0) > 6 * 3600e3) { merged.devices = { ...(merged.devices||{}), [deviceId]: { name: deviceName(), last: now() } }; }
          const before = JSON.stringify(data); data = merged; saveLocal();
          if (JSON.stringify(data) !== before) renderAll();
          if (JSON.stringify(merge(remote, empty())) === JSON.stringify(merge(merged, empty()))) break; // GitHub already up to date
          const r = await api("PUT", { message:"Notes update " + new Date().toLocaleString(), content:b64e(JSON.stringify(merged, null, 1)), sha: sha || undefined });
          if (r.ok) { sha = (await r.json()).content.sha; break; }
          if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth:true });
          if (r.status !== 409 && r.status !== 422) throw new Error("push " + r.status); // someone else saved first: pull again
        }
        lastSync = new Date(); setStatus("ok");
      } catch (e) { setStatus(e.auth ? "auth" : (navigator.onLine ? "error" : "offline")); }
      busy = false;
      if (again) { again = false; sync(); }
    }
    function queuePush() { if (!token) return; clearTimeout(pushTimer); pushTimer = setTimeout(sync, 1200); }
    addEventListener("online", sync);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
    setInterval(() => { if (!document.hidden) sync(); }, 60000);

    // ---------- Sync button + sheet ----------
    const top = document.querySelector(".top");
    const syncBtn = el("button", "syncbtn"); syncBtn.type = "button";
    top.insertBefore(syncBtn, top.lastElementChild);
    function setStatus(s) {
      status = s;
      const t = { off:"Sync off", syncing:"Syncing…", ok:"Synced", offline:"Offline", error:"Sync error", auth:"Sync code invalid" }[s];
      syncBtn.textContent = t; syncBtn.dataset.state = s;
      $("syncNow").hidden = $("syncOff").hidden = !token; $("syncForm").hidden = !!token && s !== "auth";
      $("syncMsg").textContent =
        s === "ok" ? "Connected. Last synced " + lastSync.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) + "." :
        s === "offline" ? "No signal. Your notes are saved here and will sync when you're back online." :
        s === "error" ? "Couldn't reach GitHub. Your notes are saved here; it will try again." :
        s === "auth" ? "GitHub didn't accept that sync code. Paste a new one." :
        s === "syncing" ? "Syncing…" : "";
    }
    syncBtn.onclick = () => { $("syncSheet").hidden = false; };
    $("syncClose").onclick = () => { $("syncSheet").hidden = true; };
    $("syncSheet").onclick = e => { if (e.target.id === "syncSheet") $("syncSheet").hidden = true; };
    $("syncNow").onclick = () => sync();
    $("syncOff").onclick = () => { token = ""; sha = null; try { localStorage.removeItem(SYNC); } catch (e) {} setStatus("off"); };
    $("syncForm").onsubmit = e => {
      e.preventDefault();
      const v = $("syncToken").value.trim(); if (!v) return;
      token = v; $("syncToken").value = "";
      try { localStorage.setItem(SYNC, JSON.stringify({ token:v })); } catch (e) {}
      sync();
    };

    // ---------- Pills ----------
    const pillsBox = $("pills"), panelsBox = $("panels"), all = [];
    function makeSection(cfg) {
      const open = new Set(), drafts = {}; let focusId = null;
      let editing = null; // { id, i, text } while changing a note, or { id, rename:true, text } while renaming
      const list_ = () => data.sections[cfg.key];
      const live = () => list_().filter(i => !i.deleted);

      const btn = el("button", "pill"); btn.setAttribute("aria-expanded", "false");
      const count = el("span", "n");
      btn.append(document.createTextNode(cfg.title + " "), count); btn.insertAdjacentHTML("beforeend", CHEV);
      const panel = el("div", "panel"); panel.hidden = true;
      const form = el("form", "row"), input = el("input"), addBtn = el("button", "add", "Add");
      input.placeholder = cfg.addPh; input.maxLength = 60; input.autocomplete = "off"; addBtn.type = "submit";
      form.append(input, addBtn);
      const list = el("ul", "people");
      panel.append(form, list);
      pillsBox.append(btn); panelsBox.append(panel);

      const sec = { render, close() { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); } };
      btn.onclick = () => {
        const opening = panel.hidden;
        all.forEach(o => o.close());
        if (opening) { panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
      };
      form.onsubmit = e => {
        e.preventDefault();
        const v = input.value.trim(); if (!v) return;
        input.value = "";
        const id = cfg.key + now() + Math.random().toString(36).slice(2, 6);
        list_().push({ id, name: v, created: now(), updated: now(), notes: [] });
        open.add(id); focusId = id; changed();
      };
      const setNotes = (it, notes) => { it.notes = notes; it.updated = now(); changed(); };
      const remove = it => {
        open.delete(it.id);
        Object.assign(it, { deleted:true, notes:[], updated:now() });
        changed();
      };
      // Hold ~half a second to edit. A normal tap still does the tap action.
      function holdable(node, onHold, onTap) {
        let t = null, x0 = 0, y0 = 0, held = false;
        const cancel = () => { clearTimeout(t); t = null; node.classList.remove("pressing"); };
        node.addEventListener("pointerdown", e => {
          if (e.button) return;
          held = false; x0 = e.clientX; y0 = e.clientY; node.classList.add("pressing");
          t = setTimeout(() => { held = true; cancel(); if (navigator.vibrate) navigator.vibrate(15); onHold(); }, 480);
        });
        node.addEventListener("pointermove", e => { if (t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
        ["pointerup", "pointercancel", "pointerleave"].forEach(ev => node.addEventListener(ev, cancel));
        node.addEventListener("contextmenu", e => { e.preventDefault(); if (!held) { cancel(); held = true; onHold(); } });
        node.addEventListener("click", e => { if (held) { e.preventDefault(); e.stopPropagation(); held = false; return; } if (onTap) onTap(e); });
      }

      function render() {
        const items = live().sort((a, b) => (a.created || 0) - (b.created || 0));
        count.textContent = items.length || "";
        list.replaceChildren();
        if (!items.length) list.append(el("li", "empty", cfg.empty));
        for (const it of items) {
          const li = el("li", "person"), isOpen = open.has(it.id);
          const b = el("button", "pill"); b.setAttribute("aria-expanded", isOpen);
          b.append(el("span", "nm", it.name), el("span", "n", (it.notes || []).length || ""));
          b.insertAdjacentHTML("beforeend", CHEV);
          holdable(b, () => { editing = { id: it.id, rename: true, text: it.name, armed: false }; render(); },
                      () => { isOpen ? open.delete(it.id) : open.add(it.id); render(); });
          if (editing && editing.id === it.id && editing.rename) {
            // Hold menu for a person / item: rename or delete
            const box = el("div", "editbox");
            const f = el("form", "row"), ri = el("input"), rs = el("button", "add", "Save");
            ri.value = editing.text; ri.maxLength = 60; ri.autocomplete = "off"; rs.type = "submit";
            ri.oninput = () => { editing.text = ri.value; rs.disabled = !ri.value.trim(); };
            ri.onkeydown = e => { if (e.key === "Escape") { editing = null; render(); } };
            f.onsubmit = e => { e.preventDefault(); const v = ri.value.trim(); if (!v) return; editing = null; it.name = v; it.updated = now(); changed(); };
            f.append(ri, rs);
            const acts = el("div", "meta"), cancel = el("button", "rm", "Cancel");
            const del = el("button", "rm danger", editing.armed ? "Tap again to delete " + it.name : "Delete");
            cancel.type = del.type = "button";
            cancel.onclick = () => { editing = null; render(); };
            del.onclick = () => { if (!editing.armed) { editing.armed = true; render(); return; } editing = null; remove(it); };
            acts.append(cancel, del); box.append(f, acts); li.append(box);
            setTimeout(() => { if (document.activeElement !== ri && !editing?.armed) ri.focus(); }, 0);
            list.append(li); continue;
          }
          li.append(b);
          if (isOpen) {
            const box = el("div", "notes"), ul = el("ul");
            (it.notes || []).forEach((t, i) => {
              const n = el("li", "note");
              if (editing && editing.id === it.id && editing.i === i) {
                // Changing this note: same 15-word limit as adding one
                n.classList.add("editing");
                const f = el("form", "row"), inp = el("input"), save = el("button", "add", "Save");
                inp.value = editing.text; inp.autocomplete = "off"; save.type = "submit";
                const meta = el("div", "meta"), cnt = el("span"), links = el("span", "links");
                const cancel = el("button", "rm", "Cancel"), del = el("button", "rm", "Delete");
                cancel.type = del.type = "button";
                const upd = () => { const w = words(inp.value); cnt.textContent = w + " / " + MAX + " words"; cnt.className = w > MAX ? "over" : ""; save.disabled = !w || w > MAX; };
                inp.oninput = () => { editing.text = inp.value; upd(); }; upd();
                inp.onkeydown = e => { if (e.key === "Escape") { editing = null; render(); } };
                cancel.onclick = () => { editing = null; render(); };
                del.onclick = () => { editing = null; setNotes(it, it.notes.filter((_, j) => j !== i)); };
                f.onsubmit = e => {
                  e.preventDefault();
                  const v = inp.value.trim().replace(/\s+/g, " ");
                  if (!v || words(v) > MAX) return;
                  editing = null;
                  setNotes(it, it.notes.map((x, j) => j === i ? v : x));
                };
                f.append(inp, save); links.append(cancel, del); meta.append(cnt, links);
                n.append(f, meta); ul.append(n);
                setTimeout(() => { if (document.activeElement !== inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }, 0);
                return;
              }
              n.append(el("span", null, t)); n.classList.add("holdable");
              holdable(n, () => { editing = { id: it.id, i, text: t }; render(); });
              ul.append(n);
            });
            const f = el("form", "row"), inp = el("input"), add = el("button", "add", "Add");
            inp.placeholder = cfg.notePh; inp.autocomplete = "off"; inp.value = drafts[it.id] || ""; add.type = "submit";
            const meta = el("div", "meta"), cnt = el("span"), links = el("span", "hint", "Hold to edit or delete");
            const upd = () => { const w = words(inp.value); cnt.textContent = w + " / " + MAX + " words"; cnt.className = w > MAX ? "over" : ""; add.disabled = !w || w > MAX; };
            inp.oninput = () => { drafts[it.id] = inp.value; upd(); }; upd();
            f.onsubmit = e => {
              e.preventDefault();
              const v = inp.value.trim().replace(/\s+/g, " ");
              if (!v || words(v) > MAX) return;
              drafts[it.id] = ""; focusId = it.id;
              setNotes(it, [...(it.notes || []), v]);
            };
            f.append(inp, add); meta.append(cnt, links);
            box.append(ul, f, meta); li.append(box);
            if (focusId === it.id && !editing) { focusId = null; setTimeout(() => inp.focus(), 0); }
          }
          list.append(li);
        }
      }
      return sec;
    }
    SECTIONS.forEach(c => all.push(makeSection(c)));
    function renderAll() { all.forEach(s => s.render()); }
    renderAll();
    setStatus(token ? "syncing" : "off");
    sync();
  })();
  </script>
  <main>
    <p class="hello">Hello Daxton,</p>
    <h1><span>let's take over</span><span>the world.</span></h1>
    <div class="line"></div>
    <p class="motto">If it's not a hell yes, it's a no.</p>
  </main>
<script>
  document.getElementById("day").textContent =
    new Date().toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    // A newer version was found in the background: offer a one-tap refresh
    navigator.serviceWorker.addEventListener("message", e => {
      if (e.data !== "update-ready" || document.querySelector(".update")) return;
      const b = document.createElement("button");
      b.className = "update"; b.textContent = "New version ready · Tap to refresh";
      b.onclick = () => location.reload();
      document.body.append(b);
    });
    if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
  }
</script>
</body>
