<title>Daxton's Life</title>
<style>
  :root { --ink:#f4f1ea; --dim:rgba(244,241,234,.62); --bg:#0b0b0b; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); }
  body { font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .hero { position:fixed; inset:0; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block;
              animation:settle 1s cubic-bezier(.2,.7,.2,1) both; }
  .hero::after { content:""; position:absolute; inset:0;
                 background:linear-gradient(180deg, rgba(11,11,11,.35) 0%, rgba(11,11,11,0) 22%, rgba(11,11,11,0) 45%, rgba(11,11,11,.82) 72%, #0b0b0b 100%); }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(14px + env(safe-area-inset-top)) 20px 0;
         display:flex; justify-content:space-between; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); z-index:2; }
  main { position:fixed; left:0; right:0; bottom:0; z-index:2;
         padding:0 24px calc(36px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  .hello { font-size:clamp(17px,4.6vw,22px); font-weight:500; color:var(--dim); margin-bottom:6px;
           animation:rise .6s .1s cubic-bezier(.2,.7,.2,1) both; }
  h1 { font-size:clamp(34px,10vw,84px); line-height:.92; font-weight:800; letter-spacing:-.035em;
       animation:rise .6s .2s cubic-bezier(.2,.7,.2,1) both; }
  h1 span { display:block; }
  .line { height:2px; width:56px; background:var(--ink); margin-top:22px; transform-origin:left;
          animation:grow .5s .45s cubic-bezier(.2,.7,.2,1) both; }
  .motto { margin-top:16px; font-size:clamp(16px,4.4vw,21px); font-weight:500; font-style:italic; color:var(--dim);
           animation:rise .6s .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes settle { from { transform:scale(1.08); filter:brightness(.6); } to { transform:scale(1); filter:brightness(1); } }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }

/* Relationship groups: existing people stay in To organize until moved. */
.relationship-groups{position:sticky;top:-12px;z-index:5;background:#141414;padding:10px 0;border-radius:12px}
.relationship-group[aria-pressed="true"]{background:var(--ink);color:#101010}.relationship-group[aria-pressed="true"] .n{color:#555}
.relationship-help{font-size:12px;line-height:1.5;color:var(--dim);margin:7px 3px 14px;min-height:36px}
.relationship-row{display:flex;align-items:center;gap:6px}.relationship-row>.pill{flex:1;min-width:0;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.relationship-grip{flex:none;width:36px;min-height:44px;border:0;border-radius:12px;background:#ffffff0c;color:var(--dim);font-size:26px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.relationship-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-130%) scale(1.04);box-shadow:0 16px 40px #0009;background:#f4f1ea;color:#171717;max-width:80vw}
.relationship-lifted{opacity:.35}.relationship-drop{outline:2px solid #e6c584!important;background:#806f3d55!important}.relationship-before{border-top:3px solid #e6c584}.relationship-after{border-bottom:3px solid #e6c584}
.relationship-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:4px 0 12px}.relationship-tools label{font-size:12px;color:var(--dim)}.relationship-tools select{font:inherit;font-size:14px;color:var(--ink);background:#242424;border:1px solid #ffffff40;border-radius:999px;padding:8px;margin-left:4px;color-scheme:dark}.relationship-tools button{min-height:40px}.relationship-tools button:disabled{opacity:.3;cursor:default}

</style>
</head>

      const link = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
      if (!link || !instagramUrl(link.href)) return;
      ev.preventDefault();
      openInstagram();
    }, true);
    function openInstagram() {
      if (igIos) { showInstagram("iphone", false); return; }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1500);
      fetch(IG + "api/health", { signal: ctrl.signal, cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(j => {
          if (!j || !j.ok || j.name !== "instagram-downloader") throw 0;
          const popup = window.open(IG, "_blank", "noopener");
          if (!popup) showInstagram("mac", true);
        })
        .catch(() => showInstagram("mac", false))
        .finally(() => clearTimeout(timer));
    }
    const igBtn = el("button", "pill"); igBtn.type = "button";
    igBtn.append(document.createTextNode("Instagram "));
    igBtn.insertAdjacentHTML("beforeend", CHEV);
    igBtn.onclick = () => openInstagram();
    linkPills.append(igBtn);
    // ---------- Compare versions: Main, Testing and Beta side by side (tabs on a phone) ----------
    (() => {
      const V = [
        { key:"main",    name:"Main",    sub:"Live app on your phone",   path:"../main/" },
        { key:"testing", name:"Testing", sub:"Changes waiting for your OK", path:"../testing/" },
        { key:"Beta",    name:"Beta",    sub:"Experimental ideas",        path:"../Beta/" }
      ];
      const btn = el("button", "pill"); btn.type = "button";
      btn.append(document.createTextNode("Compare versions "));
      btn.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>');
      (document.getElementById("linkPills") || pillsBox).append(btn);
      const page = $("cmpPage"), tabs = $("cmpTabs"), cols = $("cmpCols");
      let built = false, active = "main";
      // Pull the newest few changelog entries for a version: "v26: Lessons pill" and when
      async function recent(path) {
        try {
          const r = await fetch(path + "CHANGELOG.md?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) throw 0;
          const lines = (await r.text()).split("\n").filter(l => l.startsWith("- **")).slice(0, 4);
          return lines.map(l => { const m = l.match(/^- \*\*(.+?)\*\*/); return m ? m[1].replace(/ CT — /, " · ") : l; });
        } catch (e) { return null; }
      }
      function show(k) {
        active = k;
        tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
        cols.querySelectorAll(".cmp-col").forEach(c => c.classList.toggle("on", c.dataset.k === k));
      }
      function build() {
        built = true;
        V.forEach(v => {
          const t = el("button", "cmp-tab", v.name); t.type = "button"; t.dataset.k = v.key; t.setAttribute("role", "tab");
          t.onclick = () => show(v.key); tabs.append(t);
          const c = el("div", "cmp-col"); c.dataset.k = v.key;
          const head = el("div", "cmp-head");
          const h = el("div", "cmp-h"); h.append(el("b", null, v.name), el("span", null, v.sub));
          const open = el("a", "cmp-open", "Open"); open.href = v.path;
          head.append(h, open);
          const ul = el("ul", "cmp-log"); ul.append(el("li", "cmp-muted", "Loading recent changes…"));
          const frame = el("iframe", "cmp-frame"); frame.title = v.name + " version"; frame.loading = "lazy"; frame.src = v.path;
          c.append(head, ul, frame); cols.append(c);
          recent(v.path).then(items => { ul.replaceChildren(...(items && items.length ? items : ["No change history yet"]).map(x => el("li", null, x))); });
        });
        show(active);
      }
      function openCmp(push = true) {
        all.forEach(o => o.close());
        if (!built) build();
        page.hidden = false; document.body.classList.add("cmp-on");
        if (push) try { history.pushState({ cmp:1 }, "", "#compare"); } catch (e) {}
      }
      function closeCmp(pop = false) {
        page.hidden = true; document.body.classList.remove("cmp-on");
        if (!pop && location.hash === "#compare") try { history.back(); } catch (e) {}
      }
      btn.onclick = () => openCmp();
      $("cmpBack").onclick = () => closeCmp();
      addEventListener("popstate", () => { if (location.hash === "#compare") openCmp(false); else if (!page.hidden) closeCmp(true); });
      if (location.hash === "#compare") openCmp(false);
    })();
    // ---------- Your own pills (+), pills inside pills, drag and drop ----------
    // Pill list lives in section "custompills"; where each pill sits lives in "pillnest" ({ id: pill key, parent: pill key or null }).
    function closeOthers(btn) { all.forEach(o => { if (!o.panel || !o.panel.contains(btn)) o.close(); }); }
    const sect = k => (data.sections[k] = data.sections[k] || []);
    const customDefs = () => sect("custompills").filter(d => !d.deleted);
    const nestOf = key => { const r = sect("pillnest").find(i => i.id === key); return r && r.parent || null; };
    const descends = (k, anc) => { for (let i = 0, p = nestOf(k); p && i < 50; i++, p = nestOf(p)) if (p === anc) return true; return false; };
    function setParent(key, parent) {
      let r = sect("pillnest").find(i => i.id === key);
      if (!r) { r = { id:key, created:now() }; data.sections.pillnest.push(r); }
      r.parent = parent || null; r.updated = now(); changed();
    }
    const cfgFor = d => d.kind === "notes"
      ? { key:d.id, title:d.name, custom:true, addPh:"Add an item", notePh:"A note or thing to remember", rmLabel:"Remove", empty:"Nothing yet. Add your first one above." }
      : { key:d.id, title:d.name, custom:true, addPh:"Add to " + d.name, flat:true, empty:"Nothing yet. Add your first one above." };
    function renamePill(key) {
      const d = sect("custompills").find(x => x.id === key); if (!d) return;
      const v = (prompt("Rename this pill", d.name) || "").trim().replace(/\s+/g, " ").slice(0, 40);
      if (v && v !== d.name) { d.name = v; d.updated = now(); changed(); }
    }
    function deletePill(key) {
      const d = sect("custompills").find(x => x.id === key); if (!d) return;
      if (!confirm('Delete the "' + d.name + '" pill and everything in it?')) return;
      const up = nestOf(key);   // pills that were inside it move up one level
      sect("pillnest").forEach(r => { if (r.parent === key) { r.parent = up; r.updated = now(); } });
      d.deleted = true; d.updated = now(); changed();
    }
    function ensureCustom() {
      const defs = customDefs(), ids = new Set(defs.map(d => d.id));
      for (const d of defs) {
        const s = all.find(o => o.key === d.id);
        if (!s) { sect(d.id); all.push(makeSection(cfgFor(d))); }
        else if (s.btn.firstChild.textContent !== d.name + " ") s.btn.firstChild.textContent = d.name + " ";
      }
      for (let i = all.length - 1; i >= 0; i--) {
        const o = all[i];
        if (o.key && o.key.startsWith("cp-") && !ids.has(o.key)) { o.btn.remove(); o.panel.remove(); all.splice(i, 1); }
      }
    }
    function subOf(o) {
      if (!o.sub) { const box = el("div", "sub-box"), pills = el("div", "pills"), panels = el("div"); box.append(pills, panels); o.panel.prepend(box); o.sub = { box, pills, panels }; }
      return o.sub;
    }
    // The + pill: make a pill of your own
    const plusBtn = el("button", "pill pill-plus", "+"); plusBtn.type = "button"; plusBtn.setAttribute("aria-label", "Add a pill"); plusBtn.setAttribute("aria-expanded", "false");
    const plusPanel = el("div", "panel"); plusPanel.hidden = true;
    (() => {
      const f = el("form", "row"), inp = el("input"), go = el("button", "add", "Add");
      inp.placeholder = "Name your new pill"; inp.maxLength = 40; inp.autocomplete = "off"; go.type = "submit";
      f.append(inp, go);
      let kind = "flat";
      const pick = el("div", "kind-pick");
      const opt = (k, t, sub) => { const b = el("button"); b.type = "button"; b.append(document.createTextNode(t), el("small", null, sub));
        b.onclick = () => { kind = k; pick.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); }; b.setAttribute("aria-pressed", k === kind); return b; };
      pick.append(opt("flat", "Simple list", "Like Lessons"), opt("notes", "List with notes", "Like Work"));
      const tip = el("p", "plus-tip", "Tip: hold any pill for a moment, then drag it onto another pill to put it inside. Drag it to the bar at the bottom to bring it back out.");
      plusPanel.append(f, pick, tip);
      const upd = () => { go.disabled = !inp.value.trim(); }; inp.oninput = upd; upd();
      f.onsubmit = e => {
        e.preventDefault();
        const v = inp.value.trim().replace(/\s+/g, " "); if (!v) return;
        const id = "cp-" + now().toString(36) + Math.random().toString(36).slice(2, 6);
        sect("custompills").push({ id, name:v, kind, created:now(), updated:now() }); sect(id);
        inp.value = ""; upd(); changed();
        const s = all.find(o => o.key === id); if (s) s.btn.click();
      };
    })();
    plusBtn.onclick = () => { const opening = plusPanel.hidden; closeOthers(plusBtn); if (opening) { plusPanel.hidden = false; plusBtn.setAttribute("aria-expanded", "true"); } };
    all.push({ panel: plusPanel, render(){}, close() { plusPanel.hidden = true; plusBtn.setAttribute("aria-expanded", "false"); } });

    // Adventure is a menu so more adventure links can be added beside this first one.
    const adventureBtn = el("button", "pill"); adventureBtn.type = "button";
    adventureBtn.id = "adventurePill"; adventureBtn.setAttribute("aria-expanded", "false");
    adventureBtn.setAttribute("aria-controls", "adventurePanel");
    adventureBtn.append(document.createTextNode("Adventure ")); adventureBtn.insertAdjacentHTML("beforeend", CHEV);
    const adventurePanel = el("div", "panel"); adventurePanel.id = "adventurePanel"; adventurePanel.hidden = true;
    const friendLink = el("a", "pill"); friendLink.href = "stay-with-a-friend.html";
    friendLink.textContent = "Stay with a Friend"; friendLink.style.textDecoration = "none";
    const adventureLinks = el("div", "pills"); adventureLinks.append(friendLink); adventurePanel.append(adventureLinks);
    adventureBtn.onclick = () => { const opening = adventurePanel.hidden; all.forEach(o => o.close());
      if (opening) { adventurePanel.hidden = false; adventureBtn.setAttribute("aria-expanded", "true"); } };
    all.push({ panel: adventurePanel, render(){}, close(){ adventurePanel.hidden = true; adventureBtn.setAttribute("aria-expanded", "false"); } });
    pillsBox.append(adventureBtn); panelsBox.append(adventurePanel);

    function layout() {
      const secs = all.filter(o => o.key), byKey = Object.fromEntries(secs.map(o => [o.key, o]));
      for (const o of secs) {
        let p = nestOf(o.key);
        if (p && (!byKey[p] || p === o.key || descends(p, o.key))) p = null;   // missing parent or a loop: show it on the main list
        const host = p ? subOf(byKey[p]) : null;
        const pb = host ? host.pills : pillsBox, pp = host ? host.panels : panelsBox;
        if (o.btn.parentNode !== pb) pb.append(o.btn);   // only move what changed, so typing in an open pill isn't interrupted
        if (o.panel.parentNode !== pp) pp.append(o.panel);
        armDrag(o);
      }
      secs.forEach(o => { if (o.sub) o.sub.box.hidden = !o.sub.pills.children.length; });
      // keep the main list in its usual order (a pill dragged back out returns to its old spot)
      const topWant = secs.filter(o => o.btn.parentNode === pillsBox).map(o => o.btn), topHave = [...pillsBox.children].filter(n => topWant.includes(n));
      if (topWant.some((n, i) => topHave[i] !== n)) topWant.forEach(n => pillsBox.append(n));
      if (pillsBox.lastElementChild !== plusBtn) pillsBox.append(plusBtn);
      if (plusPanel.parentNode !== panelsBox) panelsBox.append(plusPanel);
    }

    // Drag: hold a pill ~0.4s, then drag it onto another pill (goes inside) or onto the bottom bar (back to the main list)
    let drag = null;
    const dropTop = el("div", "drop-top", "Drop here to put it on the main list"); dropTop.hidden = true; document.body.append(dropTop);
    document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive:false });
    function armDrag(o) {
      const b = o.btn; if (b._armed) return; b._armed = true;
      const tap = b.onclick; b.onclick = e => { if (b._dragged) return; tap.call(b, e); };
      let t = null, x0 = 0, y0 = 0;
      b.addEventListener("pointerdown", e => { if (e.button) return; x0 = e.clientX; y0 = e.clientY; clearTimeout(t); t = setTimeout(() => { t = null; startDrag(o, x0, y0); }, 420); });
      b.addEventListener("pointermove", e => { if (t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) { clearTimeout(t); t = null; } });
      ["pointerup", "pointercancel"].forEach(ev => b.addEventListener(ev, () => { clearTimeout(t); t = null; }));
      b.addEventListener("contextmenu", e => e.preventDefault());
    }
    function targetAt(x, y) {
      const hit = document.elementFromPoint(x, y); if (!hit) return null;
      if (hit.closest(".drop-top")) return "top";
      const pb = hit.closest(".pill"); if (!pb) return null;
      const o = all.find(s => s.key && s.btn === pb);
      if (!o || o === drag.o || descends(o.key, drag.o.key)) return null;
      return o;
    }
    function markTarget(tg) {
      if (drag.tg === tg) return;
      if (drag.tg) (drag.tg === "top" ? dropTop : drag.tg.btn).classList.remove("drop-on");
      drag.tg = tg; if (tg) (tg === "top" ? dropTop : tg.btn).classList.add("drop-on");
    }
    function startDrag(o, x, y) {
      const g = o.btn.cloneNode(true); g.classList.add("drag-ghost"); g.style.left = x + "px"; g.style.top = y + "px"; document.body.append(g);
      drag = { o, g, tg:null }; o.btn._dragged = true; o.btn.classList.add("dragging"); dropTop.hidden = false;
      if (navigator.vibrate) navigator.vibrate(15);
    }
    document.addEventListener("pointermove", e => { if (!drag) return; drag.g.style.left = e.clientX + "px"; drag.g.style.top = e.clientY + "px"; markTarget(targetAt(e.clientX, e.clientY)); });
    const endDrag = (e, drop) => {
      if (!drag) return;
      const { o, g } = drag; if (drop && e) markTarget(targetAt(e.clientX, e.clientY));
      const tg = drop ? drag.tg : null; markTarget(null); g.remove(); o.btn.classList.remove("dragging"); dropTop.hidden = true; drag = null;
      setTimeout(() => { o.btn._dragged = false; }, 350);
      if (tg === "top") { if (nestOf(o.key)) setParent(o.key, null); }
      else if (tg) { if (nestOf(o.key) !== tg.key) setParent(o.key, tg.key); if (tg.panel.hidden) { closeOthers(tg.btn); tg.panel.hidden = false; tg.btn.setAttribute("aria-expanded", "true"); } }
    };
    document.addEventListener("pointerup", e => endDrag(e, true));
    document.addEventListener("pointercancel", e => endDrag(e, false));

    function renderAll() { ensureCustom(); layout(); all.forEach(s => s.render()); }
    renderAll();
    setStatus(token ? "syncing" : "off");
    sync();
  })();
  </script>
  <main>
    <p class="hello">Hello Daxton,</p>
    <h1><span>let's take over</span><span>the world.</span></h1>
    <div class="line"></div>
    <p class="motto">If it's not a hell yes, it's a no.</p>
  </main>
<script>
  document.getElementById("day").textContent =
    new Date().toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    // A newer version was found in the background: offer a one-tap refresh
    navigator.serviceWorker.addEventListener("message", e => {
      if (e.data !== "update-ready" || document.querySelector(".update")) return;
      const b = document.createElement("button");
      b.className = "update"; b.textContent = "New version ready · Tap to refresh";
      b.onclick = () => location.reload();
      document.body.append(b);
    });
    if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
  }
</script>
</body>
